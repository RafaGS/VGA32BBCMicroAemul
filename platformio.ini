[platformio]
default_envs = ttgo-vga32
src_dir = .

[env:ttgo-vga32]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 4MB
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L

lib_deps =
    https://github.com/fdivitto/FabGL.git
    https://github.com/rampa069/vrEmu6502.git

;lib_ignore = vrEmu6502

build_unflags =
    -std=gnu++11
    -Os

build_flags =
    -O3
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DM6522_STATS
    -DBBC_MACHINE_PROFILE
    -mfix-esp32-psram-cache-issue
    -Icomponents/bbc_machine/include
    -Icomponents/bbc_memory
    -Icomponents/bbc_cpu
    -Icomponents/bbc_video/include
    -Icomponents/bbc_tape/include
    -Icomponents/m6522/include
    -Icomponents/sn76489/include
    -Iext/vrEmu6502/src
    -Iext/fabgl/src
    -Iext/fabgl/src/fonts
    -Iext/fabgl/src/images
    -Iext/fabgl/src/comdrivers
    -Iext/fabgl/src/devdrivers
    -Iext/fabgl/src/dispdrivers
    -Iext/fabgl/src/emudevs
    -Iext/fabgl/src/network

build_src_filter =
    +<src/main/main.cpp>
    +<src/main/default_tape.c>
    +<components/bbc_cpu/*.c>
    +<components/bbc_memory/*.c>
    +<components/bbc_video/*.c>
    +<components/bbc_machine/*.c>
    +<components/bbc_tape/*.c>
    +<components/m6522/m6522.c>
    +<components/m6522/bbc_sysvia.c>
    +<components/sn76489/sn76489.c>
    +<components/sn76489/sn76489_audio_arduino.cpp>
    -<components/sn76489/sn76489_audio.c>
    +<ext/vrEmu6502/src/*.c>
    +<ext/fabgl/src/*.cpp>
    +<ext/fabgl/src/**/*.cpp>
    +<ext/fabgl/src/*.c>
    +<ext/fabgl/src/**/*.c>
